{% extends "base.html" %}

{% block content %}
<h2>Productos</h2>
<a href="{{ url_for('productos.nuevo') }}" class="btn btn-primary mb-3">Nuevo Producto</a>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for producto in productos %}
        <tr>
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.precio | int }}</td>
            <td>{{ producto.stock }}</td>
            <td>
                <a href="{{ url_for('productos.editar', id=producto.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('productos.eliminar', id=producto.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
