{% extends "base.html" %}

{% block content %}
<h2>Clientes</h2>
<a href="{{ url_for('clientes.nuevo') }}" class="btn btn-primary mb-3">Nuevo Cliente</a>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.id }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>
                <a href="{{ url_for('clientes.editar', id=cliente.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('clientes.eliminar', id=cliente.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
