<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBol - Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .navbar {
            margin-bottom: 20px;
            border-bottom: 3px solid #dee2e6;
        }
        .navbar-brand {
            color: #000000 !important;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .container-main {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .welcome-box {
            background-color: #e7f1ff;
            border: 1px solid #cfe2ff;
            color: #084298;
            padding: 3rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="/">
                TECHBOL
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="{{ url_for('clientes.index') }}">Clientes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="{{ url_for('productos.index') }}">Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="{{ url_for('pedidos.index') }}">Pedidos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 container-main text-center">
                {% block content %}
                <div class="welcome-box">
                    <h1 class="display-5 fw-bold text-primary">¡Bienvenido a TechBol!</h1>
                    <p class="fs-4">Gestión de Inventario y Ventas</p>
                    <hr class="my-4 border-primary opacity-25">
                    <p class="text-dark">Utilice el menú superior para administrar eficientemente sus Clientes, Productos y Pedidos.</p>
                </div>
                {% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
